glob_matcher: doublestar

pre-commit:
  jobs:
    - name: format
      glob:
        - "**/*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
        - "**/*.{json,jsonc}"
        - "**/*.{css,scss}"
        - "**/*.{md,mdx}"
        - "**/*.{yml,yaml}"
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true

    - name: lint
      glob:
        - "**/*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
      run: pnpm exec oxlint {staged_files}
